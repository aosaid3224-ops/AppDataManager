name: Build IPA Installer Pro and Sync to Dev Repo

permissions:
  contents: write

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout AppDataManager
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout repo-dev
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo-dev
          token: ${{ secrets.PAT }}
          path: repo-dev

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Fix permissions
        run: |
          chmod +x source/IPAInstallerPro/layout/DEBIAN/postinst 2>/dev/null || true
          chmod +x source/IPAInstallerPro/layout/DEBIAN/prerm 2>/dev/null || true

      - name: Build IPA Installer Pro
        run: |
          cd source/IPAInstallerPro
          make clean
          make package

      - name: Copy generate-repo.py to repo-dev
        run: |
          mkdir -p repo-dev/scripts
          cp source/scripts/generate-repo.py repo-dev/scripts/

      - name: Deploy to repo-dev
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"

          mkdir -p repo-dev/pool/main/iphoneos-arm64
          cp source/IPAInstallerPro/packages/*.deb repo-dev/pool/main/iphoneos-arm64/

          cd repo-dev
          python3 scripts/generate-repo.py . --dev

          git add -A
          git commit -m "Add IPA Installer Pro (dev build)" || true
          git push origin main

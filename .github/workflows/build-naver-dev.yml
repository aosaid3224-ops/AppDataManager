name: Build NaverSeriesBypass and Sync to Dev Repo

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build-naver-dev:
    name: Build NaverSeriesBypass (Dev)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source

      - name: Checkout repo-dev
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo-dev
          token: ${{ secrets.PAT }}
          path: repo-dev

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/package/deb.mk"

      - name: Build NaverSeriesBypass
        run: |
          cd source/NaverSeriesBypass
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/postrm 2>/dev/null || true
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          DEB_FILE=$(ls -t packages/*.deb | head -1)
          test -n "$DEB_FILE"
          dpkg-deb -f "$DEB_FILE" Package Version Architecture
          test "$(dpkg-deb -f "$DEB_FILE" Package)" = "com.aosaid.naverseriesbypass"
          test "$(dpkg-deb -f "$DEB_FILE" Architecture)" = "iphoneos-arm64"
          echo "DEB_FILE=$DEB_FILE" >> "$GITHUB_ENV"

      - name: Deploy to repo-dev
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          mkdir -p repo-dev/pool/main/iphoneos-arm64 repo-dev/scripts
          cp source/NaverSeriesBypass/packages/*.deb repo-dev/pool/main/iphoneos-arm64/
          cp source/scripts/generate-repo.py repo-dev/scripts/generate-repo.py
          cd repo-dev
          python3 scripts/generate-repo.py . --dev
          python3 ../source/scripts/validate-repo.py .
          git add -A
          if git diff --cached --quiet; then
            echo "repo-dev already contains this build"
          else
            VERSION=$(dpkg-deb -f ../source/NaverSeriesBypass/packages/*.deb Version | head -1)
            git commit -m "NaverSeriesBypass ${VERSION} — dev build"
            git push origin main
          fi

      - name: Summary
        if: always()
        run: |
          echo "Dev repo: https://aosaid3224-ops.github.io/repo-dev/"
          echo "Package: com.aosaid.naverseriesbypass"
